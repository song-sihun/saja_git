<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>id</th>
        <th>name</th>
    </tr>

    </thead>
    <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.key}"></td>
            <td th:text="${user.value}"></td>
        </tr>
    </tbody>

    <form action="/logout" method="post">
        <input type="submit" value="Logout">
    </form>
</table>

</body>
</html>
