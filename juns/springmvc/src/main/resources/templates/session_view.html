<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>key</th>
        <th>value</th>
    </tr>

    </thead>
    <tbody>
    <tr th:each="temp : ${sessions}">
        <td th:text="${temp.key}"></td>
        <td th:text="${temp.value}"></td>
        <td><a th:href="@{/sessionDel(sessionKey=${temp.key})}">삭제</a></td>
    </tr>
    </tbody>
</table>
<a href="/sessionForm">세션등록</a>
<a href="/visit">방문횟수</a>

</body>
</html>
