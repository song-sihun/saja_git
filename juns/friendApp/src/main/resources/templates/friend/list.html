<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"  lang="en">
<head>
    <meta charset="UTF-8">
    <title>친구목록보기</title>
</head>
<body>
<h1>친구목록보기</h1>

<table>
    <tr>
        <th>번호</th>
        <th>이름</th>
        <th>이메일</th>
        <th>수정</th>
        <th>삭제</th>

    </tr>
    <tr th:each="friend : ${friends}">
        <td th:text="${friend.id}"></td>
        <td>
            <a th:href="@{/friend/list/{id}(id=${friend.id})}" th:text="${friend.name}">
            </a>
        </td>
        <td th:text="${friend.email}"></td>
        <td>
            <form th:action="@{/friend/update/{id}(id=${friend.id})}" method="get">
                <button type="submit" style="color: white; background-color: greenyellow; border: none; padding: 3px 8px; cursor: pointer;">수정</button>
            </form>
        </td>
        <td>
            <form th:action="@{/friend/delete/{id}(id=${friend.id})}" method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button type="submit" style="color: white; background-color: red; border: none; padding: 3px 8px; cursor: pointer;">삭제</button>
            </form>
        </td>
    </tr>
</table>

<form action="/friend/add" method="get">
    <button type="submit" style="color: white; background-color:burlywood; border: none; padding: 3px 8px; cursor: pointer;">친구등록</button>
</form>
<div th:if="${page.totalPages > 1}">
    <ul>
        <li th:each="i:${#numbers.sequence(1,page.totalPages)}">
            <a th:href="@{/friend/list(page=${i - 1})}" th:text="${i}" th:classappend="${page.number == i - 1}?'active'"></a>
        </li>
    </ul>
</div>
